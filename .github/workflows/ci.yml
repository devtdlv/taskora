name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, lint, type check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway PostgreSQL that only exists for this job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskora
          POSTGRES_PASSWORD: taskora
          POSTGRES_DB: taskora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskora -d taskora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only placeholders, not secrets. DATABASE_URL is only read by
    # prisma generate and is never connected to; the database tests use
    # TEST_DATABASE_URL. Everything else the app reads (APP_URL,
    # RATE_LIMIT_SECRET, RESEND_API_KEY, EMAIL_FROM) is only needed at
    # request time, so it is left unset and no email can be sent.
    env:
      DATABASE_URL: postgresql://taskora:taskora@localhost:5432/taskora
      TEST_DATABASE_URL: postgresql://taskora:taskora@localhost:5432/taskora_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit and source checks
        run: npm test

      - name: Database tests
        run: npm run test:db

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
